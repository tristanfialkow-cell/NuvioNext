[workspace]
resolver = "2"
members = ["nuvio-core", "nuvio-core-jni"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license-file = "../LICENSE"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding is required so the JNI layer can turn panics into Java exceptions instead of aborting the app.
panic = "unwind"
debug = false
