[package]
name = "nuvio-core-jni"
description = "JNI bindings exposing nuvio-core to the Nuvio Next Android app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "nuvio_core"
crate-type = ["cdylib"]

[dependencies]
nuvio-core = { path = "../nuvio-core" }
jni = { version = "0.21.1", default-features = false }
