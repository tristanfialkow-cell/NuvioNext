name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Rust core (rust/): toolchain and targets come from rust/rust-toolchain.toml.
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --version 4.1.2 --locked

      - name: Check and test Rust core
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Test updater and Rust parity, build fullDebug APK
        run: ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.updater.*' --tests 'com.nuvio.tv.core.debrid.*' :app:assembleFullDebug --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
